repos:
  - repo: local
    hooks:
      - id: checkstyle
        name: Checkstyle
        entry: bash -c 'cd backend && ./mvnw checkstyle:check -q'
        language: system
        files: ^backend/.*\.java$
        pass_filenames: false
      - id: bun-lint
        name: Bun Lint
        entry: bash -c 'export PATH="$HOME/.bun/bin:$HOME/.nvm/versions/node/v22.23.2/bin:$PATH" && cd frontend && ./node_modules/.bin/eslint "${@#frontend/}"' --
        language: system
        files: ^frontend/.*\.(js|ts|vue|mjs)$
        pass_filenames: true
        verbose: true
      - id: bun-typecheck
        name: Bun Typecheck
        entry: bash -c 'export PATH="$HOME/.bun/bin:$HOME/.nvm/versions/node/v22.23.2/bin:$PATH" && cd frontend && bun run typecheck'
        language: system
        files: ^frontend/
        pass_filenames: false
        verbose: true
      - id: docker-compose-check
        name: Validate Docker Compose
        entry: docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet
        language: system
        files: ^docker-compose.*\.yml$
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-xml
      - id: check-yaml
        exclude: ^docker-compose.*\.yml$
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: no-commit-to-branch
        args: [--branch, main]
        stages: [pre-commit, pre-push]

  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint
        args: ['--failure-threshold', 'warning']
        files: Dockerfile(?!.*\.jml)
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
