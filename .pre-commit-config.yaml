repos:
  - repo: local
    hooks:
      - id: checkstyle
        name: Checkstyle
        entry: ./mvnw checkstyle:check -q
        language: system
        files: ^backend/.*\.java$
        pass_filenames: false
      - id: bun-gate
        name: Bun Gate
        entry: bash -c 'cd frontend && bun run gate'
        language: system
        files: ^frontend/
        pass_filenames: false
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1024]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
