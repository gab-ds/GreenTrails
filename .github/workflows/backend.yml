name: Backend

on:
  push:
    paths:
      - 'backend/**'
    branches:
      - main
  pull_request:
    paths:
      - 'backend/**'
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      checks: write
      pull-requests: write
    outputs:
      reports_ok: ${{ steps.check.outputs.ok }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: ./backend/Dockerfile
          failure-threshold: warning
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v3
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Cache dipendenze Maven
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
      - name: Cache PIT history
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ./backend/target/pit-history
          key: ${{ runner.os }}-pit-history-${{ github.ref_name }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-pit-history-${{ github.ref_name }}-
            ${{ runner.os }}-pit-history-
      - name: Checkstyle
        run: mvn checkstyle:check --batch-mode
      - name: Esegui test
        id: test
        continue-on-error: ${{ github.event_name != 'pull_request' }}
        run: mvn test jacoco:report surefire-report:report pitest:mutationCoverage -Dthreads=4 -DhistoryInputFile=target/pit-history/history.bin -DhistoryOutputFile=target/pit-history/history.bin -DmutationThreshold=80 --batch-mode
      - name: Verifica report
        id: check
        run: |
          if [ -d "target/reports" ] && [ -f "target/site/jacoco/jacoco.xml" ] && [ -d "target/pit-reports" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Genera badge coverage
        if: steps.check.outputs.ok == 'true'
        uses: cicirello/jacoco-badge-generator@72266185b7ee48a6fd74eaf0238395cc8b14fef8 # v2
        with:
          badges-directory: badges
          generate-branches-badge: true
          generate-summary: true
          jacoco-csv-file: backend/target/site/jacoco/jacoco.csv
      - name: Carica report come artifact per deploy
        if: github.event_name != 'pull_request' && steps.check.outputs.ok == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-reports
          path: |
            ./backend/target/site/jacoco/
            ./backend/target/reports/
            ./backend/target/pit-reports/
          retention-days: 30
      - name: Carica report come artifact per PR
        if: github.event_name == 'pull_request' && steps.check.outputs.ok == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-reports-${{ github.event.pull_request.number }}
          path: |
            ./backend/target/site/jacoco/
            ./backend/target/reports/
            ./backend/target/pit-reports/
          retention-days: 30
      - name: Pubblica Test Report
        if: always() && steps.check.outputs.ok == 'true'
        uses: scacap/action-surefire-report@3dacff26879cd2a7f2160d101254032a3707fe6f # v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          report_paths: './backend/target/surefire-reports/TEST-*.xml'
      - name: JaCoCo Code Coverage Report
        id: jacoco_reporter
        if: always() && steps.check.outputs.ok == 'true'
        uses: PavanMudigonda/jacoco-reporter@64fa5a142a874e1deb636cffd882cecf86a2b9e7 # v5.0
        with:
          coverage_results_path: ./backend/target/site/jacoco/jacoco.xml
          coverage_report_name: Coverage
          coverage_report_title: JaCoCo
          github_token: ${{ secrets.GITHUB_TOKEN }}
          skip_check_run: false
          minimum_coverage: 80
          fail_below_threshold: ${{ github.event_name == 'pull_request' }}
          publish_only_summary: false
      - name: Aggiungi report JaCoCo al workflow summary
        if: steps.jacoco_reporter.outcome == 'success'
        run: |
          {
            echo "## :bar_chart: JaCoCo Code Coverage"
            echo ""
            echo "| Metrica | Valore |"
            echo "| --- | --- |"
            echo "| Code Coverage % | ${{ steps.jacoco_reporter.outputs.coverage_percentage }} |"
            echo "| :heavy_check_mark: Linee Coperte | ${{ steps.jacoco_reporter.outputs.covered_lines }} |"
            echo "| :x: Linee Non Coperte | ${{ steps.jacoco_reporter.outputs.missed_lines }} |"
            echo "| :chart_with_upwards_trend: Linee Totali | ${{ steps.jacoco_reporter.outputs.total_lines }} |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Carica JaCoCo Report come Artifact
        if: always() && steps.check.outputs.ok == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jacoco-coverage-report
          path: ./backend/target/site/jacoco/
          retention-days: 30
      - name: Upload coverage to CodeCov
        if: steps.check.outputs.ok == 'true'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./backend/target/site/jacoco/jacoco.xml
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload test results to CodeCov
        if: always()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: './backend/target/surefire-reports/TEST-*.xml'
          report_type: test_results
          token: ${{ secrets.CODECOV_TOKEN }}
          handle_no_reports_found: true

  deploy-reports:
    name: Deploy Reports
    needs: [test]
    if: github.event_name != 'pull_request' && needs.test.outputs.reports_ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: test-reports
          path: .
      - name: Prepara le cartelle per il deploy
        working-directory: .
        run: |
          mkdir -p public/surefire public/jacoco public/pit
          cp -r ./backend/target/reports/* ./public/surefire/
          cp -r ./backend/target/site/jacoco/* ./public/jacoco/
          cp -r ./backend/target/pit-reports/* ./public/pit/
      - uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          destination_dir: ${{ github.sha }}/report
          keep_files: true

  docker:
    name: Docker
    needs: [test]
    permissions:
      contents: read
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Cache Maven mount
        id: cache-m2
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: m2-cache
          key: ${{ runner.os }}-m2-cache-${{ hashFiles('backend/pom.xml') }}
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        id: buildx
      - name: Restore Docker cache mounts
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-dir: m2-cache
          dockerfile: backend/Dockerfile
          skip-extraction: ${{ steps.cache-m2.outputs.cache-hit }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: gabdis/greentrails-backend
          tags: |
            type=raw,value=latest
            type=sha,prefix=main-
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

defaults:
  run:
    working-directory: ./backend
