---
- name: Apply Persistent Host Isolation and Reboot
  hosts: proxmox_host
  become: true

  pre_tasks:
    - name: Verify the benchmark host has exactly four online CPUs
      ansible.builtin.command: cat /sys/devices/system/cpu/online
      register: online_cpus
      changed_when: false
      failed_when: online_cpus.stdout | trim != '0-3'

    - name: Verify cpufreq-set is already installed
      ansible.builtin.shell: command -v cpufreq-set
      register: cpufreq_set_binary
      changed_when: false
      failed_when: cpufreq_set_binary.rc != 0

  tasks:
    - name: Ensure systemd drop-in directory exists
      ansible.builtin.file:
        path: /etc/systemd/system.conf.d
        state: directory
        mode: '0755'

    - name: Apply CPUAffinity override (Host cores 0,1)
      ansible.builtin.copy:
        dest: /etc/systemd/system.conf.d/99-cpu-affinity.conf
        content: |
          [Manager]
          CPUAffinity={{ host_cpu_set | replace(',', ' ') }}
        mode: '0644'

    - name: Reboot Proxmox host to cleanly apply systemd CPUAffinity
      ansible.builtin.reboot:
        msg: "Rebooting Proxmox host to apply CPUAffinity settings"
        connect_timeout: 5
        reboot_timeout: 300
        pre_reboot_delay: 2
        post_reboot_delay: 15

    - name: Verify CPUAffinity is correctly set
      ansible.builtin.command: systemctl show -p CPUAffinity
      register: cpu_affinity
      changed_when: false

    - name: Fail if CPUAffinity is not set to host cores 0,1
      ansible.builtin.fail:
        msg: "Expected CPUAffinity={{ host_cpu_set | replace(',', ' ') }} but got: {{ cpu_affinity.stdout }}"
      when: "(host_cpu_set | replace(',', ' ')) not in cpu_affinity.stdout"

    - name: Enable qemu-vmsr-helper.socket for RAPL MSR passthrough
      ansible.builtin.systemd:
        name: qemu-vmsr-helper.socket
        state: started
        enabled: yes

    - name: Verify RAPL is available on host
      ansible.builtin.command: cat /sys/class/powercap/intel-rapl/enabled
      register: rapl_enabled
      changed_when: false
      failed_when: rapl_enabled.stdout != '1'
