---
- name: Build Backend JARs
  hosts: localhost
  gather_facts: no

  vars:
    backend_src: "{{ playbook_dir }}/../../backend"
    build_dir: "{{ playbook_dir }}/.build"
    amber_jmh_jar: "{{ playbook_dir }}/../../third_party/AMBER/jmh-core-1.37-all.jar"
    backend_jar: "{{ backend_src }}/target/backend-0.0.1-SNAPSHOT.jar"
    benchmark_jar: "{{ backend_src }}/target/benchmarks.jar"

  pre_tasks:
    - name: Check backend build inputs
      ansible.builtin.stat:
        path: "{{ item.path }}"
      loop:
        - name: Backend Maven project
          path: "{{ backend_src }}/pom.xml"
        - name: Maven wrapper
          path: "{{ backend_src }}/mvnw"
        - name: AMBER JMH dependency
          path: "{{ amber_jmh_jar }}"
      register: build_input_stats

    - name: Validate backend build inputs
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg | default(false)
          - (item.item.name != 'Maven wrapper' or item.stat.executable | default(false))
        fail_msg: "Required build input is missing or unusable: {{ item.item.path }}"
      loop: "{{ build_input_stats.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: Check Java runtime
      ansible.builtin.command: java -version
      register: java_version
      changed_when: false

    - name: Require Java 21
      ansible.builtin.assert:
        that:
          - "'21' in (java_version.stderr ~ java_version.stdout)"
        fail_msg: "Java 21 is required to build the backend and benchmarks."

    - name: Check Maven wrapper availability
      ansible.builtin.command: ./mvnw --version
      args:
        chdir: "{{ backend_src }}"
      changed_when: false

  tasks:
    - name: Ensure build directory exists
      ansible.builtin.file:
        path: "{{ build_dir }}"
        state: directory

    - name: Build Spring Boot JAR
      ansible.builtin.command:
        argv:
          - ./mvnw
          - clean
          - package
          - -DskipTests=true
      args:
        chdir: "{{ backend_src }}"
      changed_when: true

    - name: Verify Spring Boot JAR was built
      ansible.builtin.stat:
        path: "{{ backend_jar }}"
      register: backend_jar_stats

    - name: Require Spring Boot JAR
      ansible.builtin.assert:
        that:
          - backend_jar_stats.stat.exists
          - backend_jar_stats.stat.isreg | default(false)
        fail_msg: "Spring Boot JAR was not produced at {{ backend_jar }}."

    - name: Copy Spring Boot JAR to build directory
      ansible.builtin.copy:
        src: "{{ backend_jar }}"
        dest: "{{ build_dir }}/backend.jar"
        remote_src: yes

    - name: Install AMBER JMH dependency
      ansible.builtin.command:
        argv:
          - ./mvnw
          - install:install-file
          - "-Dfile={{ amber_jmh_jar }}"
          - -DgroupId=org.openjdk.jmh
          - -DartifactId=jmh-core
          - -Dversion=1.37-extended
          - -Dpackaging=jar
      args:
        chdir: "{{ backend_src }}"
      changed_when: true

    - name: Build Benchmark JAR
      ansible.builtin.command:
        argv:
          - ./mvnw
          - -Pbenchmark,amber
          - clean
          - package
          - -DskipTests=true
      args:
        chdir: "{{ backend_src }}"
      changed_when: true

    - name: Verify Benchmark JAR was built
      ansible.builtin.stat:
        path: "{{ benchmark_jar }}"
      register: benchmark_jar_stats

    - name: Require Benchmark JAR
      ansible.builtin.assert:
        that:
          - benchmark_jar_stats.stat.exists
          - benchmark_jar_stats.stat.isreg | default(false)
        fail_msg: "Benchmark JAR was not produced at {{ benchmark_jar }}."

    - name: Copy Benchmark JAR to build directory
      ansible.builtin.copy:
        src: "{{ benchmark_jar }}"
        dest: "{{ build_dir }}/benchmarks.jar"
        remote_src: yes

- name: Create Base Cloud-Init Template
  hosts: proxmox_host
  become: true

  module_defaults:
    group/community.proxmox.proxmox:
      api_host: "{{ proxmox_api_host }}"
      api_user: "{{ proxmox_api_user }}"
      api_token_id: "{{ proxmox_api_token_id }}"
      api_token_secret: "{{ proxmox_api_token_secret }}"
      validate_certs: "{{ proxmox_validate_certs }}"
      ca_path: "{{ proxmox_ca_path if proxmox_ca_path | length > 0 else omit }}"

  pre_tasks:
    - name: Check required AMBER service files on the control node
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ amber_service_src }}/service.py"
        - "{{ amber_service_src }}/setup.py"
        - "{{ amber_service_src }}/config.py"
        - "{{ amber_service_src }}/requirements.txt"
        - "{{ amber_service_src }}/wrap_fcn.py"
        - "{{ amber_service_src }}/wrap_oscnn.py"
        - "{{ amber_service_src }}/wrap_rocket.py"
        - "{{ amber_service_src }}/models/FCN_0.h5"
        - "{{ amber_service_src }}/models/OSCNN_0.pt"
        - "{{ amber_service_src }}/models/Rocket_0.zip"
        - "{{ amber_service_src }}/OmniScaleCNN/Classifiers/OS_CNN/OS_CNN_easy_use.py"
        - "{{ amber_service_src }}/OmniScaleCNN/Classifiers/OS_CNN/OS_CNN_Structure_build.py"
      register: amber_source_stats
      delegate_to: localhost
      become: false

    - name: Require AMBER service files
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg | default(false)
        fail_msg: >-
          Required AMBER source file is missing. Initialize the AMBER submodule
          or restore the file: {{ item.item }}
      loop: "{{ amber_source_stats.results }}"
      loop_control:
        label: "{{ item.item }}"
      delegate_to: localhost
      become: false

    - name: Validate Proxmox API configuration
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/validate_proxmox_credentials.yml"

    - name: Verify benchmark bridge and gateway on the Proxmox host
      ansible.builtin.command: ip -4 addr show dev "{{ benchmark_bridge }}"
      register: benchmark_bridge_status
      changed_when: false
      failed_when: benchmark_bridge_status.rc != 0 or benchmark_gateway not in benchmark_bridge_status.stdout

  vars:
    image_url: "https://cloud.debian.org/images/cloud/trixie/latest/debian-13-generic-amd64.qcow2"
    energibridge_repo: "https://github.com/tdurieux/EnergiBridge.git"
    energibridge_dest: "/opt/energibridge"

  tasks:
    - name: Enable qemu-vmsr-helper.socket for RAPL MSR passthrough
      ansible.builtin.systemd:
        name: qemu-vmsr-helper.socket
        state: started
        enabled: yes

    - name: Verify RAPL is available on host
      ansible.builtin.command: cat /sys/class/powercap/intel-rapl/enabled
      register: rapl_enabled
      changed_when: false
      failed_when: rapl_enabled.stdout != '1'

    - name: Download Debian Cloud image
      ansible.builtin.get_url:
        url: "{{ image_url }}"
        dest: /tmp/debian-cloud.qcow2

    - name: Create VM
      community.proxmox.proxmox_kvm:
        node: "{{ hostvars['pve_node']['node'] }}"
        vmid: "{{ hostvars['vm_template']['proxmox_vmid'] }}"
        name: "debian-java-benchmark-template"
        memory: 2048
        cores: "{{ worker_vcpus }}"
        sockets: 1
        agent: enabled=1
        net: '{"net0":"virtio,bridge={{ benchmark_bridge }}"}'
        ide:
          ide2: "{{ proxmox_cloudinit_storage }}:cloudinit"
        ipconfig:
          ipconfig0: "ip={{ hostvars['vm_worker']['worker_vm_ip'] }}/24,gw={{ benchmark_gateway }}"
        scsihw: "virtio-scsi-pci"
        state: present

    - name: Import OS Disk into VM
      community.proxmox.proxmox_disk:
        vmid: "{{ hostvars['vm_template']['proxmox_vmid'] }}"
        disk: scsi0
        import_from: "/tmp/debian-cloud.qcow2"
        storage: "local-lvm"
        state: present

    - name: Power on VM for provisioning
      community.proxmox.proxmox_kvm:
        vmid: "{{ hostvars['vm_template']['proxmox_vmid'] }}"
        state: started

    - name: Wait for QEMU Guest Agent readiness
      block:
        - name: Ping QEMU Guest Agent
          ansible.builtin.command: qm agent "{{ hostvars['vm_template']['proxmox_vmid'] }}" ping
          register: guest_agent_ping
          until: guest_agent_ping.rc == 0
          retries: 30
          delay: 2
          changed_when: false
      rescue:
        - name: Collect VM status after QEMU Guest Agent timeout
          ansible.builtin.command: qm status "{{ hostvars['vm_template']['proxmox_vmid'] }}"
          register: guest_agent_vm_status
          changed_when: false
          failed_when: false

        - name: Collect VM configuration after QEMU Guest Agent timeout
          ansible.builtin.command: qm config "{{ hostvars['vm_template']['proxmox_vmid'] }}"
          register: guest_agent_vm_config
          changed_when: false
          failed_when: false

        - name: Fail with QEMU Guest Agent diagnostics
          ansible.builtin.fail:
            msg: >-
              QEMU Guest Agent did not become ready for VMID
              {{ hostvars['vm_template']['proxmox_vmid'] }}.
              Status: {{ guest_agent_vm_status.stdout | default('unavailable') }}.
              Configuration: {{ guest_agent_vm_config.stdout | default('unavailable') }}.

- name: Provision Base Template
  hosts: template_vm

  vars:
    build_dir: "{{ playbook_dir }}/.build"
    energibridge_repo: "https://github.com/tdurieux/EnergiBridge.git"
    energibridge_version: "2925da73bb85c0643f7aaa902f7d62c6d67baae2"
    energibridge_dest: "/opt/energibridge"
    backend_dest: "/opt/greentrails"
    benchmark_dest: "/opt/benchmark-suite/target"
    amber_host: "{{ hostvars['amber_server']['amber_lxc_ip'] }}"
    energy_script_src: "{{ playbook_dir }}/energy_measure.sh"
    energy_script_dest: "/usr/local/bin/energy_measure.sh"

  pre_tasks:
    - name: Validate MySQL database identifiers and password
      ansible.builtin.assert:
        that:
          - db_name | default('') is match('^[A-Za-z][A-Za-z0-9_]*$')
          - db_user | default('') is match('^[A-Za-z][A-Za-z0-9_]*$')
          - db_pass | default('') | length > 0
        fail_msg: >-
          GT_DB_NAME and GT_DB_USER must start with a letter and contain only
          letters, numbers, and underscores; GT_DB_PASS must be non-empty.

  tasks:
    - name: Wait for Cloud-Init completion
      block:
        - name: Wait for Cloud-Init with a bounded timeout
          ansible.builtin.command: timeout 300 cloud-init status --wait
          register: cloud_init_status
          changed_when: false
          failed_when: cloud_init_status.rc != 0
      rescue:
        - name: Collect Cloud-Init status after timeout
          ansible.builtin.command: cloud-init status --long
          register: cloud_init_debug
          changed_when: false
          failed_when: false

        - name: Collect Cloud-Init logs after timeout
          ansible.builtin.command: journalctl -u cloud-init -u cloud-final -n 50 --no-pager
          register: cloud_init_logs_debug
          changed_when: false
          failed_when: false

        - name: Fail with Cloud-Init diagnostics
          ansible.builtin.fail:
            msg: >-
              Cloud-Init did not complete successfully within 300 seconds.
              Status: {{ cloud_init_debug.stdout | default('unavailable') }}.
              Logs: {{ cloud_init_logs_debug.stdout | default('unavailable') }}.

    - name: Verify worker network address is configured
      ansible.builtin.command: ip -4 addr show
      register: template_network
      until: hostvars['vm_worker']['worker_vm_ip'] in template_network.stdout
      retries: 30
      delay: 2
      changed_when: false
      failed_when: hostvars['vm_worker']['worker_vm_ip'] not in template_network.stdout

    - name: Ensure prerequisite packages are installed
      ansible.builtin.apt:
        name:
          - wget
          - apt-transport-https
          - gnupg
        state: present
        update_cache: yes

    - name: Ensure trusted directory exists
      ansible.builtin.file:
        path: /etc/apt/trusted.gpg.d
        state: directory
        mode: '0755'

    - name: Download Eclipse Adoptium GPG key
      ansible.builtin.get_url:
        url: https://packages.adoptium.net/artifactory/api/gpg/key/public
        dest: /tmp/adoptium.asc
        mode: '0600'

    - name: Dearmor Eclipse Adoptium GPG key
      ansible.builtin.command:
        cmd: gpg --dearmor -o /etc/apt/trusted.gpg.d/adoptium.gpg /tmp/adoptium.asc
        creates: /etc/apt/trusted.gpg.d/adoptium.gpg

    - name: Add Eclipse Adoptium APT repository
      ansible.builtin.apt_repository:
        repo: "deb https://packages.adoptium.net/artifactory/deb {{ ansible_distribution_release }} main"
        state: present
        filename: adoptium

    - name: Clean up temporary raw GPG key
      ansible.builtin.file:
        path: /tmp/adoptium.asc
        state: absent

    - name: Install guest dependencies
      ansible.builtin.apt:
        name:
          - temurin-21-jdk
          - qemu-guest-agent
          - git
          - curl
          - maven
          - mysql-server
          - python3-pymysql
          - cmake
          - build-essential
        state: present
        update_cache: yes

    - name: Ensure MySQL directory exists for socket
      ansible.builtin.file:
        path: /var/run/mysqld
        state: directory
        owner: mysql
        group: mysql
        mode: '0755'

    - name: Start MySQL for initial setup
      ansible.builtin.systemd:
        name: mysql
        state: started

    - name: Create GreenTrails database
      ansible.mysql.mysql_db:
        name: "{{ db_name }}"
        state: present
        login_user: root
        login_unix_socket: /var/run/mysqld/mysqld.sock
        config_file: ''
        check_implicit_admin: true
      no_log: true

    - name: Create GreenTrails application user and grant database access
      ansible.mysql.mysql_user:
        name: "{{ db_user }}"
        host: localhost
        password: "{{ db_pass }}"
        priv:
          "{{ db_name }}.*": ALL
        state: present
        login_user: root
        login_unix_socket: /var/run/mysqld/mysqld.sock
        config_file: ''
        check_implicit_admin: true
      no_log: true

    - name: Disable MySQL outside energy measurements
      ansible.builtin.systemd:
        name: mysql
        state: stopped
        enabled: false

    - name: Install Rust toolchain
      ansible.builtin.shell: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      args:
        creates: /root/.cargo/bin/rustc

    - name: Clone EnergiBridge repository
      ansible.builtin.git:
        repo: "{{ energibridge_repo }}"
        dest: "{{ energibridge_dest }}"
        version: "{{ energibridge_version }}"

    - name: Build EnergiBridge
      ansible.builtin.shell: |
        export PATH="/root/.cargo/bin:$PATH"
        cargo build --release
      args:
        chdir: "{{ energibridge_dest }}"
      changed_when: true

    - name: Symlink EnergiBridge binary
      ansible.builtin.file:
        src: "{{ energibridge_dest }}/target/release/energibridge"
        dest: /usr/local/bin/energibridge
        state: link

    - name: Create backend installation directory
      ansible.builtin.file:
        path: "{{ backend_dest }}"
        state: directory
        mode: '0755'

    - name: Deploy Spring Boot JAR
      ansible.builtin.copy:
        src: "{{ build_dir }}/backend.jar"
        dest: "{{ backend_dest }}/backend.jar"
        mode: '0644'

    - name: Create benchmark suite directory
      ansible.builtin.file:
        path: "{{ benchmark_dest }}"
        state: directory
        mode: '0755'

    - name: Deploy Benchmark JAR
      ansible.builtin.copy:
        src: "{{ build_dir }}/benchmarks.jar"
        dest: "{{ benchmark_dest }}/benchmarks.jar"
        mode: '0644'

    - name: Deploy custom minimal benchmark.target
      ansible.builtin.copy:
        dest: /etc/systemd/system/benchmark.target
        content: |
          [Unit]
          Description=Minimal Isolated Target for JMH Benchmarks
          Requires=basic.target qemu-guest-agent.service
          After=basic.target qemu-guest-agent.service
          AllowIsolate=yes
        mode: '0644'

    - name: Deploy benchmark runner script
      ansible.builtin.copy:
        dest: /usr/local/bin/run_benchmarks.sh
        mode: '0755'
        content: |
          #!/bin/bash
          set -Eeuo pipefail

          restore_multi_user_target() {
              status=$?
              trap - EXIT INT TERM
              set +e
              echo "[+] Restoring multi-user.target..."
              systemctl isolate multi-user.target
              exit "$status"
          }

          trap restore_multi_user_target EXIT INT TERM

          echo "[+] Switching to minimal benchmark.target..."
          systemctl isolate benchmark.target

          echo "[+] Starting JMH benchmarks..."
          SPRING_PROFILES_ACTIVE=dev SPRING_JPA_SHOW_SQL=false \
          java -jar /opt/benchmark-suite/target/benchmarks.jar \
            -f {{ jmh_forks | quote }} \
            -wi {{ jmh_warmups | quote }} \
            -i {{ jmh_iterations | quote }} \
            -hmodel {{ amber_model | quote }} \
            -host {{ amber_host | quote }} \
            -hport {{ amber_service_port | quote }}

    - name: Deploy energy measurement script
      ansible.builtin.copy:
        src: "{{ energy_script_src }}"
        dest: "{{ energy_script_dest }}"
        mode: '0755'

- name: Create & Provision Debian Trixie LXC for AMBER Server
  hosts: proxmox_host
  become: true

  module_defaults:
    group/community.proxmox.proxmox:
      api_host: "{{ proxmox_api_host }}"
      api_user: "{{ proxmox_api_user }}"
      api_token_id: "{{ proxmox_api_token_id }}"
      api_token_secret: "{{ proxmox_api_token_secret }}"
      validate_certs: "{{ proxmox_validate_certs }}"
      ca_path: "{{ proxmox_ca_path if proxmox_ca_path | length > 0 else omit }}"

  pre_tasks:
    - name: Validate Proxmox API configuration
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/validate_proxmox_credentials.yml"

  vars:
    amber_template_name: ""
    amber_template_volid: "local:vztmpl/{{ amber_template_name }}"
    amber_service_src: "{{ playbook_dir }}/../../third_party/AMBER/jpt_service"
    amber_service_dest: "/opt/amber"
    amber_python_version: "3.9.24"
    amber_python_root: "/opt/pyenv"
    amber_python_bin: "{{ amber_python_root }}/versions/{{ amber_python_version }}/bin/python"
    amber_venv: "{{ amber_service_dest }}/.venv"

  tasks:
    - name: Update LXC template catalog
      ansible.builtin.command: pveam update
      changed_when: false

    - name: List available Debian Trixie LXC templates
      ansible.builtin.command: pveam available --section system
      register: available_lxc_templates
      changed_when: false

    - name: Select Debian Trixie LXC template
      ansible.builtin.set_fact:
        amber_template_name: >-
          {{ available_lxc_templates.stdout
             | regex_search('debian-13-standard_[^ ]+_amd64[.]tar[.](zst|xz|gz)')
             | default('', true) }}

    - name: Require a Debian Trixie LXC template
      ansible.builtin.assert:
        that:
          - amber_template_name | length > 0
        fail_msg: >-
          No Debian Trixie (Debian 13) amd64 LXC template is available from
          the configured Proxmox appliance catalog.

    - name: Check if Debian Trixie template is already downloaded
      community.proxmox.proxmox_storage_contents_info:
        node: "{{ hostvars['pve_node']['node'] }}"
        storage: local
      register: storage_contents

    - name: Download Debian Trixie LXC template
      ansible.builtin.command:
        argv:
          - pveam
          - download
          - local
          - "{{ amber_template_name }}"
      when: amber_template_volid not in (storage_contents.proxmox_storage_content | map(attribute='volid') | list)

    - name: Create Debian Trixie LXC container
      community.proxmox.proxmox:
        node: "{{ hostvars['pve_node']['node'] }}"
        vmid: "{{ hostvars['amber_server']['proxmox_vmid'] }}"
        hostname: "amber-server"
        ostemplate: "{{ amber_template_volid }}"
        password: "{{ amber_lxc_password }}"
        ostype: "debian"
        cpus: 2
        memory: 4096
        swap: 1024
        disk: "local-lvm:16"
        netif:
          net0: "name=eth0,bridge={{ benchmark_bridge }},ip={{ hostvars['amber_server']['amber_lxc_ip'] }}/24,gw={{ benchmark_gateway }}"
        features:
          - "nesting=1"
          - "keyctl=1"
        unprivileged: true
        state: present
      no_log: true

    - name: Start LXC container
      community.proxmox.proxmox:
        node: "{{ hostvars['pve_node']['node'] }}"
        vmid: "{{ hostvars['amber_server']['proxmox_vmid'] }}"
        state: started

    - name: Wait for AMBER LXC readiness
      block:
        - name: Wait for AMBER LXC to be running
          ansible.builtin.command: pct status "{{ hostvars['amber_server']['proxmox_vmid'] }}"
          register: amber_lxc_status
          until:
            - amber_lxc_status.rc == 0
            - "'status: running' in amber_lxc_status.stdout"
          retries: 30
          delay: 2
          changed_when: false

        - name: Verify AMBER LXC command execution
          ansible.builtin.command:
            argv:
              - pct
              - exec
              - "{{ hostvars['amber_server']['proxmox_vmid'] }}"
              - --
              - true
          register: amber_lxc_exec
          until: amber_lxc_exec.rc == 0
          retries: 15
          delay: 2
          changed_when: false
      rescue:
        - name: Collect AMBER LXC status after readiness timeout
          ansible.builtin.command: pct status "{{ hostvars['amber_server']['proxmox_vmid'] }}"
          register: amber_lxc_status_debug
          changed_when: false
          failed_when: false

        - name: Collect AMBER LXC configuration after readiness timeout
          ansible.builtin.command: pct config "{{ hostvars['amber_server']['proxmox_vmid'] }}"
          register: amber_lxc_config_debug
          changed_when: false
          failed_when: false

        - name: Fail with AMBER LXC readiness diagnostics
          ansible.builtin.fail:
            msg: >-
              AMBER LXC VMID {{ hostvars['amber_server']['proxmox_vmid'] }} did not
              become ready. Status: {{ amber_lxc_status_debug.stdout | default('unavailable') }}.
              Configuration: {{ amber_lxc_config_debug.stdout | default('unavailable') }}.

    - name: Update Debian package catalog in LXC
      ansible.builtin.command:
        argv:
          - pct
          - exec
          - "{{ hostvars['amber_server']['proxmox_vmid'] }}"
          - --
          - apt-get
          - update
      changed_when: false

    - name: Install Debian AMBER build and SSH packages in LXC
      ansible.builtin.command:
        argv:
          - pct
          - exec
          - "{{ hostvars['amber_server']['proxmox_vmid'] }}"
          - --
          - apt-get
          - install
          - -y
          - --no-install-recommends
          - ca-certificates
          - curl
          - git
          - openssh-server
          - build-essential
          - libbz2-dev
          - libffi-dev
          - liblzma-dev
          - libncursesw5-dev
          - libreadline-dev
          - libsqlite3-dev
          - libssl-dev
          - libxml2-dev
          - libxmlsec1-dev
          - tk-dev
          - uuid-dev
          - wget
          - xz-utils
      changed_when: true

    - name: Install Python 3.9 for AMBER in LXC
      ansible.builtin.command:
        argv:
          - pct
          - exec
          - "{{ hostvars['amber_server']['proxmox_vmid'] }}"
          - --
          - sh
          - -c
          - >-
            if [ ! -x {{ amber_python_bin }} ]; then
            if [ ! -x {{ amber_python_root }}/bin/pyenv ]; then
            git clone --depth 1 https://github.com/pyenv/pyenv.git {{ amber_python_root }};
            fi;
            PYENV_ROOT={{ amber_python_root }} {{ amber_python_root }}/bin/pyenv install --skip-existing {{ amber_python_version }};
            fi
      changed_when: true

    - name: Generate temporary SSH keypair on control node
      ansible.builtin.command: >
        ssh-keygen -t ed25519
        -f {{ playbook_dir }}/.ssh_amber_lxc_tmp -N ""
        -C "amber-provisioning"
      delegate_to: localhost
      become: false
      args:
        creates: "{{ playbook_dir }}/.ssh_amber_lxc_tmp"

    - name: Install SSH public key in LXC container
      ansible.builtin.shell: |
        PUB=$(cat {{ playbook_dir }}/.ssh_amber_lxc_tmp.pub)
        pct exec {{ hostvars['amber_server']['proxmox_vmid'] }} -- sh -c "mkdir -p /root/.ssh && echo '$PUB' > /root/.ssh/authorized_keys && chmod 700 /root/.ssh && chmod 600 /root/.ssh/authorized_keys"
      changed_when: true

    - name: Start SSH daemon in LXC
      ansible.builtin.command: >
        pct exec {{ hostvars['amber_server']['proxmox_vmid'] }} -- systemctl start ssh
      changed_when: true

    - name: Add AMBER LXC to in-memory inventory for SSH
      ansible.builtin.add_host:
        name: amber_lxc
        ansible_host: "{{ hostvars['amber_server']['amber_lxc_ip'] }}"
        ansible_user: root
        ansible_ssh_private_key_file: "{{ playbook_dir }}/.ssh_amber_lxc_tmp"
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no"

    - name: Wait for SSH to be ready
      ansible.builtin.wait_for_connection:
        delay: 5
        timeout: 30
      delegate_to: amber_lxc

    - name: Copy AMBER service files to LXC container
      ansible.builtin.copy:
        src: "{{ amber_service_src }}/"
        dest: "{{ amber_service_dest }}/"
        mode: '0644'
        directory_mode: '0755'
      delegate_to: amber_lxc

    - name: Create AMBER Python virtual environment
      ansible.builtin.command:
        argv:
          - "{{ amber_python_bin }}"
          - -m
          - venv
          - "{{ amber_venv }}"
        creates: "{{ amber_venv }}/bin/python"
      delegate_to: amber_lxc

    - name: Install AMBER Python dependencies
      ansible.builtin.pip:
        requirements: "{{ amber_service_dest }}/requirements.txt"
        executable: "{{ amber_venv }}/bin/pip"
      delegate_to: amber_lxc

    - name: Install AMBER systemd service unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/amber.service
        mode: '0644'
        content: |
          [Unit]
          Description=AMBER prediction service
          Wants=network-online.target
          After=network-online.target

          [Service]
          Type=simple
          WorkingDirectory={{ amber_service_dest }}
          ExecStart={{ amber_venv }}/bin/python {{ amber_service_dest }}/service.py
          Environment=PYTHONUNBUFFERED=1
          Restart=on-failure
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
      delegate_to: amber_lxc

    - name: Enable AMBER systemd service for container boot
      ansible.builtin.systemd:
        name: amber.service
        daemon_reload: true
        enabled: true
        state: stopped
      delegate_to: amber_lxc

    - name: Verify AMBER service.py is in place
      ansible.builtin.stat:
        path: "{{ amber_service_dest }}/service.py"
      register: amber_stat
      delegate_to: amber_lxc
      failed_when: not amber_stat.stat.exists

    - name: Stop LXC container
      community.proxmox.proxmox:
        node: "{{ hostvars['pve_node']['node'] }}"
        vmid: "{{ hostvars['amber_server']['proxmox_vmid'] }}"
        state: stopped

    - name: Remove temporary SSH keypair from control node
      ansible.builtin.file:
        path: "{{ playbook_dir }}/{{ item }}"
        state: absent
      loop:
        - .ssh_amber_lxc_tmp
        - .ssh_amber_lxc_tmp.pub
      delegate_to: localhost
      become: false

    - name: Disable SSH in LXC after provisioning
      ansible.builtin.command: >
        pct exec {{ hostvars['amber_server']['proxmox_vmid'] }} -- systemctl stop ssh
      changed_when: true
      ignore_errors: true

- name: Convert VM & Cleanup
  hosts: proxmox_host
  become: true

  module_defaults:
    group/community.proxmox.proxmox:
      api_host: "{{ proxmox_api_host }}"
      api_user: "{{ proxmox_api_user }}"
      api_token_id: "{{ proxmox_api_token_id }}"
      api_token_secret: "{{ proxmox_api_token_secret }}"
      validate_certs: "{{ proxmox_validate_certs }}"
      ca_path: "{{ proxmox_ca_path if proxmox_ca_path | length > 0 else omit }}"

  pre_tasks:
    - name: Validate Proxmox API configuration
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/validate_proxmox_credentials.yml"

  tasks:
    - name: Gracefully stop VM prior to template conversion
      community.proxmox.proxmox_kvm:
        vmid: "{{ hostvars['vm_template']['proxmox_vmid'] }}"
        state: stopped

    - name: Convert VM to Template
      community.proxmox.proxmox_kvm:
        node: "{{ hostvars['pve_node']['node'] }}"
        vmid: "{{ hostvars['vm_template']['proxmox_vmid'] }}"
        state: template

    - name: Clean up temporary cloud image
      ansible.builtin.file:
        path: /tmp/debian-cloud.qcow2
        state: absent

    - name: Clean up local build artifacts
      ansible.builtin.file:
        path: "{{ playbook_dir }}/.build"
        state: absent
      delegate_to: localhost
      become: false
