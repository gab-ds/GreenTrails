---
- name: Validate required Proxmox API settings
  ansible.builtin.assert:
    that:
      - proxmox_api_host | default('') | length > 0
      - proxmox_api_user | default('') | length > 0
      - proxmox_api_token_id | default('') | length > 0
      - proxmox_api_token_secret | default('') | length > 0
      - proxmox_node | default('') | length > 0
    fail_msg: >-
      Set PROXMOX_HOST, PROXMOX_USER, PROXMOX_TOKEN_ID,
      PROXMOX_TOKEN_SECRET, and optionally PROXMOX_NODE before running
      benchmark automation.
