[proxmox_host]
pve_node ansible_host="{{ lookup('env', 'PROXMOX_HOST') }}" ansible_user="{{ lookup('env', 'PROXMOX_SSH_USER') | default('root', true) }}" node="{{ proxmox_node }}"

[template_vm]
vm_template proxmox_vmid=9000 ansible_host=192.168.2.100

[worker_vm]
vm_worker proxmox_vmid=935 worker_vm_ip=192.168.2.100 ansible_host=192.168.2.100

[amber_lxc]
amber_server proxmox_vmid=936 amber_lxc_ip=192.168.2.11

[guest_vms:children]
template_vm
worker_vm

[all:vars]
proxmox_api_host="{{ lookup('env', 'PROXMOX_HOST') }}"
proxmox_api_user="{{ lookup('env', 'PROXMOX_USER') }}"
proxmox_api_token_id="{{ lookup('env', 'PROXMOX_TOKEN_ID') }}"
proxmox_api_token_secret="{{ lookup('env', 'PROXMOX_TOKEN_SECRET') }}"
proxmox_node="{{ lookup('env', 'PROXMOX_NODE') | default('pve', true) }}"
proxmox_validate_certs="{{ lookup('env', 'PROXMOX_VALIDATE_CERTS') | default('no', true) }}"
proxmox_ca_path="{{ lookup('env', 'PROXMOX_CA_PATH') | default('', true) }}"
benchmark_bridge="{{ lookup('env', 'GT_BENCHMARK_BRIDGE') | default('vnet0', true) }}"
benchmark_gateway="{{ lookup('env', 'GT_BENCHMARK_GATEWAY') | default('192.168.2.1', true) }}"
proxmox_cloudinit_storage="{{ lookup('env', 'PROXMOX_CLOUDINIT_STORAGE') | default('local-lvm', true) }}"
proxmox_import_storage="{{ lookup('env', 'PROXMOX_IMPORT_STORAGE') | default('local', true) }}"
benchmark_stale_worker_policy="{{ lookup('env', 'GT_STALE_WORKER_POLICY') | default('fail', true) }}"
host_cpu_set="0,1"
worker_cpu_set="2,3"
worker_vcpus=2
template_vm_ip=192.168.2.100
amber_model="{{ lookup('env', 'GT_AMBER_MODEL') | default('oscnn', true) }}"
amber_service_port=5001
jmh_forks=3
jmh_warmups=5
jmh_iterations=10
db_name="{{ lookup('env', 'GT_DB_NAME') | default('greentrails') }}"
db_user="{{ lookup('env', 'GT_DB_USER') | default('greentrails') }}"
db_pass="{{ lookup('env', 'GT_DB_PASS') }}"
amber_lxc_password="{{ lookup('env', 'GT_AMBER_LXC_PASSWORD') }}"
vm_password="{{ lookup('env', 'GT_VM_PASSWORD') }}"

[guest_vms:vars]
ansible_connection=ssh
ansible_user=debian
ansible_become=true
ansible_password={{ lookup('env', 'GT_VM_PASSWORD') }}
ansible_ssh_private_key_file={{ playbook_dir }}/.ssh_id_vm_tmp
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o IdentitiesOnly=yes -o UserKnownHostsFile=/dev/null -o ProxyJump={{ lookup("env", "PROXMOX_SSH_USER") | default("root", true) }}@{{ lookup("env", "PROXMOX_HOST") }}'
