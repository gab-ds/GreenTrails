services:
  backend:
    ports:
      - "8443:8443"
    volumes:
      - ./certs:/app/certs:ro
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - SSL_CERT_PATH=file:/app/certs/cert.pem
      - SSL_KEY_PATH=file:/app/certs/key.pem
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --no-check-certificate https://localhost:8443/actuator/health || exit 1"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: 0.5

  frontend:
    volumes:
      - ./certs/cert.pem:/app/certs/cert.pem:ro
    environment:
      - NUXT_API_BASE_URL=https://backend:8443/api
      - NUXT_PUBLIC_API_BASE_URL=https://localhost:8443/api
      - NODE_EXTRA_CA_CERTS=/app/certs/cert.pem
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: 0.1

  db:
    restart: unless-stopped
    ports: !reset []
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: 0.2
