spring:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: 'true'
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}

greentrails:
  seed:
    password: ${SEED_PASSWORD:password}

server:
  error:
    include-message: always
