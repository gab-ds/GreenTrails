server:
  port: 8443
  ssl:
    bundle: "web-server"

spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: 'true'
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
  ssl:
    bundle:
      pem:
        web-server:
          keystore:
            certificate: "${SSL_CERT_PATH:file:../certs/cert.pem}"
            private-key: "${SSL_KEY_PATH:file:../certs/key.pem}"
